<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miami Tic Tac Toe</title>
    <link rel="stylesheet" href="styles/miami.css">
</head>
<body>
    <div class="welcome-screen">
        <h1>Welcome to Miami Tic Tac Toe!</h1>
        <input type="text" id="username" placeholder="Enter your username" />
        <button id="start-game">Start New Game</button>
    </div>
    <div class="game-screen" style="display: none;">
        <h2 id="player-turn"></h2>
        <div class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button id="reset-game">Reset Game</button>
        <div class="score-board">
            <h3>Score</h3>
            <p id="score-display">Player: 0</p>
        </div>
    </div>
    <script src="scripts/main.js"></script>
    <script src="scripts/game.js"></script>
    <script src="scripts/score.js"></script>
</body>
</html>
