<!-- Miami Vibe Tic Tac Toe -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacPalms - Miami Vibe</title>
    <link rel="stylesheet" href="styles/miami.css">
</head>
<body>
    <div id="welcome" class="page">
        <h1>TicTacPalms</h1>
        <p>Welcome to Miami Vibe Tic Tac Toe!</p>
        <input type="text" id="username" placeholder="Enter your username">
        <button id="startBtn">Start New Game</button>
    </div>
    <div id="game" class="page" style="display:none;">
        <h2 id="playerLabel"></h2>
        <div id="board"></div>
        <button id="backBtn">Back to Welcome</button>
    </div>
    <div id="scores" class="page" style="display:none;">
        <h2>Scores</h2>
        <ul id="scoreList"></ul>
        <button id="closeScoresBtn">Close</button>
    </div>
    <script src="scripts/main.js"></script>
</body>
</html>
