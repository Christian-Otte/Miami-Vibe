<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Palm City Paddle</title>
  <style>
    body {
      background: #231557 url('Background.png') no-repeat center center fixed;
      background-size: cover;
      color: #fffbe7;
      font-family: system-ui;
      text-align: center;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }
    /* Remove SVG background and .main-content wrapper */
    canvas { background: linear-gradient(180deg, #0ff0b3 0%, #ff61a6 100%); display:block; margin:24px auto; border-radius: 18px; box-shadow: 0 0 32px #ff61a6aa; }
    #startScreen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(34,0,51,0.92) url('Startscreen.png') center center / contain no-repeat;
      color: #fffbe7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8vh;
      z-index: 10;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .mode-buttons {
      width: 100vw;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      margin: 8vh 0 12vh 0;
      pointer-events: auto;
    }
    .mode-buttons button {
      min-width: 220px;
      margin: 0 4vw;
    }
    #startScreen h1 {
      font-family: 'Segoe Script', cursive, system-ui;
      font-size: 3em;
      color: #ff61a6;
      text-shadow: 0 0 16px #0ff0b3, 0 0 32px #ff61a6;
      margin-bottom: 0.2em;
    }
    #startScreen button {
      font-size: 1.5em;
      margin: 12px;
      padding: 10px 32px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #0ff0b3 0%, #ff61a6 100%);
      color: #231557;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 12px #ff61a6aa;
    }
    #startScreen button:hover { background: linear-gradient(90deg, #ff61a6 0%, #0ff0b3 100%); color: #fff; }
    #startScreen p {
      color: #fffbe7;
      text-shadow: 0 0 8px #0ff0b3;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <audio id="startMusic" src="jan-hammer-miami-vice-theme.mp3" loop></audio>
    <div class="mode-buttons">
      <button onclick="startGame(false)">Single Player (W/S)</button>
      <button onclick="startGame(true)">2 Player (W/S & O/L)</button>
    </div>
    <label style="margin-top:1.5em; font-size:1.1em; color:#fffbe7; text-shadow:0 0 8px #0ff0b3;">
      Play to 
      <input id="winLimitInput" type="number" min="1" max="20" value="5" style="width:3em; font-size:1em; border-radius:4px; border:none; padding:2px 6px; margin:0 4px;">
      wins
    </label>
    <label style="margin-top:1em; font-size:1.1em; color:#fffbe7; text-shadow:0 0 8px #0ff0b3;">
      Level
      <input id="levelInput" type="number" min="1" max="10" value="1" style="width:3em; font-size:1em; border-radius:4px; border:none; padding:2px 6px; margin:0 4px;">
      (1 = slow, 10 = fast)
    </label>
    <p style="margin-top:2em;font-size:0.9em;opacity:0.7;">Player 1 controls: W/S<br>Player 2 controls: O/L</p>
  </div>
  <h1 style="display:none;">Palm City Paddle</h1>
  <p style="display:none;">Controls: W / S</p>
  <audio id="gameMusic" src="jan-hammer-crocketts-theme.mp3" loop></audio>
  <audio id="hitSound" src="pong_hit.wav"></audio>
  <audio id="gameOverSound" src="pong_game_over_long.wav"></audio>
  <audio id="pointLostSound" src="pong_point_lost.wav"></audio>
  <canvas id="game" width="800" height="500"></canvas>
  <!-- Miami Vice Palm Tree (left) -->
  <div style="position:fixed;left:0;bottom:0;z-index:2;pointer-events:none;width:120px;height:320px;">
    <svg viewBox="0 0 60 160" width="100%" height="100%">
      <rect x="26" y="80" width="8" height="70" fill="#0ff0b3"/>
      <ellipse cx="30" cy="90" rx="30" ry="10" fill="#0ff0b3" fill-opacity="0.7"/>
      <ellipse cx="30" cy="100" rx="25" ry="8" fill="#ff61a6" fill-opacity="0.5"/>
      <path d="M30 90 Q10 60 30 60 Q50 60 30 90" fill="#ffef8a" fill-opacity="0.7"/>
      <path d="M30 90 Q0 80 10 50" stroke="#0ff0b3" stroke-width="3" fill="none"/>
      <path d="M30 90 Q60 80 50 50" stroke="#0ff0b3" stroke-width="3" fill="none"/>
    </svg>
  </div>
  <!-- Miami Vice Sports Car (right) -->
  <div style="position:fixed;right:0;bottom:0;z-index:2;pointer-events:none;width:220px;height:100px;">
    <svg viewBox="0 0 220 100" width="100%" height="100%">
      <rect x="30" y="60" width="140" height="30" rx="12" fill="#ff61a6" stroke="#fffbe7" stroke-width="3"/>
      <rect x="120" y="40" width="60" height="25" rx="8" fill="#0ff0b3" stroke="#fffbe7" stroke-width="2"/>
      <ellipse cx="50" cy="90" rx="18" ry="12" fill="#231557" stroke="#fffbe7" stroke-width="3"/>
      <ellipse cx="150" cy="90" rx="18" ry="12" fill="#231557" stroke="#fffbe7" stroke-width="3"/>
      <ellipse cx="50" cy="90" rx="8" ry="8" fill="#ffef8a"/>
      <ellipse cx="150" cy="90" rx="8" ry="8" fill="#ffef8a"/>
      <rect x="170" y="70" width="30" height="10" rx="3" fill="#ffef8a" fill-opacity="0.7"/>
      <rect x="30" y="70" width="20" height="10" rx="3" fill="#ffef8a" fill-opacity="0.7"/>
    </svg>
  </div>
  <script>
    let twoPlayer = false;
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Configurable win limit (default 5, can be changed on start screen)
    let WIN_LIMIT = 5;
    let LEVEL = 1;
    let BASE_BALL_SPEED = 4;

    const state = {
      paddleLeft:  { x: 20, y: canvas.height/2 - 40, w: 12, h: 80, dy: 0, speed: 6 },
      paddleRight: { x: canvas.width - 32, y: canvas.height/2 - 40, w: 12, h: 80, dy: 0, speed: 6 },
      ball:        { x: canvas.width/2, y: canvas.height/2, r: 8, vx: BASE_BALL_SPEED, vy: 2 },
      score:       { left: 0, right: 0 }
    };

    let running = false;
    let paused = false;
    let winner = null;

    const keys = new Set();
    addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
    addEventListener('keyup',   e => keys.delete(e.key.toLowerCase()));

    function update() {
      if (winner) return; // Stop updating if game is over

      // Player 1 (left): W/S
      const pL = state.paddleLeft;
      pL.dy = (keys.has('w') ? -1 : 0) + (keys.has('s') ? 1 : 0);
      pL.y += pL.dy * pL.speed;
      pL.y = Math.max(0, Math.min(canvas.height - pL.h, pL.y));

      // Player 2 (right): O/L or AI
      const pR = state.paddleRight, b = state.ball;
      if (twoPlayer) {
        pR.dy = (keys.has('o') ? -1 : 0) + (keys.has('l') ? 1 : 0);
        pR.y += pR.dy * pR.speed;
      } else {
        pR.y += Math.sign(b.y - (pR.y + pR.h/2)) * pR.speed * 0.9;
      }
      pR.y = Math.max(0, Math.min(canvas.height - pR.h, pR.y));

      // Ball physics
      b.x += b.vx; b.y += b.vy;
      if (b.y - b.r < 0 || b.y + b.r > canvas.height) b.vy *= -1;

      // Collisions
      if (b.x - b.r < pL.x + pL.w && b.y > pL.y && b.y < pL.y + pL.h) {
        b.x = pL.x + pL.w + b.r; b.vx *= -1.05; b.vy += (b.y - (pL.y + pL.h/2))*0.05;
        playHitSound();
      }
      if (b.x + b.r > pR.x && b.y > pR.y && b.y < pR.y + pR.h) {
        b.x = pR.x - b.r; b.vx *= -1.05; b.vy += (b.y - (pR.y + pR.h/2))*0.05;
        playHitSound();
      }

      // Scoring
      if (b.x < 0)  { state.score.right++; playPointLostSound(); checkWinner(); if(!winner) resetBall(-1); }
      if (b.x > canvas.width) { state.score.left++; playPointLostSound(); checkWinner(); if(!winner) resetBall(1); }
    }

    function checkWinner() {
      if (state.score.left >= WIN_LIMIT) {
        winner = "Player 1";
        running = false;
        playGameOverSound();
        showWinnerScreen(winner);
      } else if (state.score.right >= WIN_LIMIT) {
        winner = twoPlayer ? "Player 2" : "AI";
        running = false;
        playGameOverSound();
        showWinnerScreen(winner);
      }
    }

    function resetBall(dir = 1) {
      const b = state.ball;
      b.x = canvas.width/2; b.y = canvas.height/2;
      // Ball speed depends on level
      const speed = BASE_BALL_SPEED + (LEVEL - 1) * 1.2;
      b.vx = speed * dir;
      b.vy = (Math.random()*4 - 2) * (speed/BASE_BALL_SPEED);
    }

    function draw() {
      // Miami Vice style colors
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Draw center line
      for(let y=0; y<canvas.height; y+=32){
        ctx.fillStyle = "#fffbe7";
        ctx.fillRect(canvas.width/2-2, y, 4, 16);
      }
      // Paddles
      ctx.fillStyle = "#0ff0b3";
      ctx.shadowColor = "#0ff0b3";
      ctx.shadowBlur = 16;
      ctx.fillRect(state.paddleLeft.x,  state.paddleLeft.y,  state.paddleLeft.w,  state.paddleLeft.h);
      ctx.fillStyle = "#ff61a6";
      ctx.shadowColor = "#ff61a6";
      ctx.fillRect(state.paddleRight.x, state.paddleRight.y, state.paddleRight.w, state.paddleRight.h);
      ctx.shadowBlur = 0;
      // Ball
      ctx.beginPath();
      ctx.arc(state.ball.x, state.ball.y, state.ball.r, 0, Math.PI*2);
      ctx.closePath();
      ctx.fillStyle = "#fffbe7";
      ctx.shadowColor = "#fffbe7";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
      // Score
      ctx.font = 'bold 40px "Segoe Script", system-ui, cursive';
      ctx.textAlign = 'center';
      ctx.fillStyle = "#fffbe7";
      ctx.shadowColor = "#ff61a6";
      ctx.shadowBlur = 10;
      ctx.fillText(`${state.score.left} : ${state.score.right}`, canvas.width/2, 60);
      ctx.shadowBlur = 0;
    }

    function showWinnerScreen(winnerName) {
      // Overlay winner screen
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = "#231557";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
      ctx.font = 'bold 54px "Segoe Script", system-ui, cursive';
      ctx.fillStyle = "#ff61a6";
      ctx.textAlign = 'center';
      ctx.shadowColor = "#0ff0b3";
      ctx.shadowBlur = 24;
      ctx.fillText(`${winnerName} wins!`, canvas.width/2, canvas.height/2 - 20);
      ctx.shadowBlur = 0;
      ctx.font = '24px system-ui';
      ctx.fillStyle = "#fffbe7";
      ctx.fillText('Press R to restart', canvas.width/2, canvas.height/2 + 40);
      ctx.restore();
    }

    function loop(){
      if (!running && !winner) return;
      if (!paused && !winner) {
        update(); draw();
      } else if (winner) {
        showWinnerScreen(winner);
      }
      requestAnimationFrame(loop);
    }

    // Pause/Unpause on 'P'
    addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'p' && running && !winner) {
        paused = !paused;
        // Show a pause overlay
        if (paused) {
          ctx.save();
          ctx.globalAlpha = 0.8;
          ctx.fillStyle = '#231557';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.globalAlpha = 1;
          ctx.font = 'bold 64px "Segoe Script", system-ui, cursive';
          ctx.fillStyle = '#ff61a6';
          ctx.textAlign = 'center';
          ctx.shadowColor = "#0ff0b3";
          ctx.shadowBlur = 20;
          ctx.fillText('Paused', canvas.width/2, canvas.height/2);
          ctx.shadowBlur = 0;
          ctx.restore();
        }
      }
      // Restart on 'R' if game ended
      if (e.key.toLowerCase() === 'r' && winner) {
        restartGame();
      }
    });

    // Play music on start screen, pause when game starts
    window.addEventListener('DOMContentLoaded', () => {
      const music = document.getElementById('startMusic');
      if (music) {
        music.volume = 0.5;
        // Only play if the start screen is visible
        const tryPlay = () => {
          if (document.getElementById('startScreen').style.display !== 'none') {
            music.currentTime = 0;
            music.play().catch(()=>{});
          }
        };
        // Try to play on load and on first user interaction
        tryPlay();
        window.addEventListener('click', tryPlay, { once: true });
        window.addEventListener('keydown', tryPlay, { once: true });
      }
    });
    function startGame(isTwoPlayer) {
      // Read win limit and level from input
      const input = document.getElementById('winLimitInput');
      WIN_LIMIT = Math.max(1, Math.min(20, parseInt(input.value) || 5));
      const levelInput = document.getElementById('levelInput');
      LEVEL = Math.max(1, Math.min(10, parseInt(levelInput.value) || 1));
      twoPlayer = isTwoPlayer;
      document.getElementById('startScreen').style.display = 'none';
      document.querySelector('h1').style.display = '';
      document.querySelector('p').style.display = '';
      running = true;
      paused = false;
      winner = null;
      // Reset state
      state.paddleLeft.y = canvas.height/2 - 40;
      state.paddleRight.y = canvas.height/2 - 40;
      state.score.left = 0; state.score.right = 0;
      resetBall(1);
      // Pause start screen music, play game music
      const startMusic = document.getElementById('startMusic');
      if (startMusic) startMusic.pause();
      const gameMusic = document.getElementById('gameMusic');
      if (gameMusic) {
        gameMusic.currentTime = 0;
        gameMusic.volume = 0.5;
        gameMusic.play().catch(()=>{});
      }
      loop();
    }
    function restartGame() {
      winner = null;
      state.score.left = 0;
      state.score.right = 0;
      resetBall(1);
      // Play game music again if not playing
      const gameMusic = document.getElementById('gameMusic');
      if (gameMusic && gameMusic.paused) {
        gameMusic.currentTime = 0;
        gameMusic.play().catch(()=>{});
      }
      loop();
    }
    function playHitSound() {
      const sound = document.getElementById('hitSound');
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(()=>{});
      }
    }
    function playGameOverSound() {
      const sound = document.getElementById('gameOverSound');
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(()=>{});
      }
    }
    function playPointLostSound() {
      const sound = document.getElementById('pointLostSound');
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(()=>{});
      }
    }
  </script>
</body>
</html>
